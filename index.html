<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON SONG LAB</title>
<style>
:root{
 --bg:#080a12;--panel:#111522;--line:#30394d;
 --text:#f4f7ff;--muted:#8791a8;
 --cyan:#39f6ff;--pink:#ff4fc3;--lime:#b8ff4d;
}
*{box-sizing:border-box}
body{
 margin:0;background:radial-gradient(circle at 20% 0%,#17253b,#080a12 55%);
 color:var(--text);font-family:ui-monospace,monospace
}
.app{max-width:760px;margin:auto;padding:16px}
h1{color:var(--cyan);font-size:25px;margin:0}
.sub{color:var(--muted);font-size:11px;margin:5px 0 15px}
.panel{
 background:#111522ee;border:2px solid var(--line);
 border-radius:14px;padding:14px;margin:12px 0
}
h2{font-size:13px;color:var(--lime);margin:0 0 10px}
button{
 font:inherit;color:var(--text);background:#181e2d;
 border:2px solid #3a455d;border-radius:9px;padding:8px 11px
}
button.active,button.selected{
 border-color:var(--cyan);color:var(--cyan)
}
.row{display:flex;gap:7px;flex-wrap:wrap}
.notes button{min-width:40px}
.notes button.selected{background:var(--cyan);color:#061015}
#bpm{font-size:28px;color:var(--pink);margin-right:10px}
.status{font-size:11px;color:var(--muted);margin-top:8px}
.chord{padding:9px 11px}
.chord.selected{border-color:var(--pink);color:var(--pink)}
.diagram{
 min-height:260px;display:flex;justify-content:center;
 align-items:center;overflow:auto
}
.empty{color:var(--muted);text-align:center;padding:50px 10px}
.position{margin-top:10px}
.credit{font-size:10px;color:#69748a;line-height:1.5}

/* guitar */
.guitar{
 position:relative;width:340px;height:250px;
 flex:none
}
.guitar-title{
 position:absolute;left:0;top:0;
 color:var(--pink);font-size:20px;font-weight:bold
}
.board{
 position:absolute;left:65px;top:50px;
 width:255px;height:175px;
 border-left:6px solid #eee
}
.string{
 position:absolute;top:0;bottom:0;
 width:2px;background:#aeb7c8
}
.fret{
 position:absolute;left:0;right:0;height:2px;
 background:#68748c
}
.nut{
 position:absolute;left:-5px;top:-3px;
 width:6px;height:181px;background:#fff
}
.finger{
 position:absolute;width:27px;height:27px;
 border-radius:50%;background:var(--cyan);
 color:#061015;font-size:11px;font-weight:bold;
 display:flex;align-items:center;justify-content:center;
 transform:translate(-50%,-50%);z-index:5
}
.open,.muted{
 position:absolute;top:-30px;
 transform:translateX(-50%);font-weight:bold
}
.open{color:var(--lime)}
.muted{color:var(--pink)}
.fretnum{
 position:absolute;left:-35px;
 color:#7e899e;font-size:10px
}
.barre{
 position:absolute;height:22px;
 border:4px solid var(--cyan);
 border-radius:12px;
 transform:translateY(-50%)
}

/* piano */
.piano{
 position:relative;width:350px;height:220px;flex:none
}
.piano-title{
 position:absolute;top:0;left:0;
 color:var(--pink);font-size:20px;font-weight:bold
}
.keys{
 position:absolute;left:0;right:0;top:48px;
 height:155px;display:flex
}
.white{
 position:relative;flex:1;
 background:#f5f7fb;border:1px solid #111;
 color:#111
}
.black{
 position:absolute;top:0;width:8%;
 height:100px;background:#111;
 border-radius:0 0 5px 5px;z-index:3
}
.key-dot{
 position:absolute;bottom:18px;left:50%;
 transform:translateX(-50%);
 width:25px;height:25px;border-radius:50%;
 background:var(--pink);color:white;
 display:flex;align-items:center;justify-content:center;
 font-size:9px;font-weight:bold
}
</style>
</head>

<body>
<div class="app">

<h1>NEON SONG LAB</h1>
<div class="sub">BPM → NOTE → SCALE → CHORD → REAL VOICING</div>

<section class="panel">
<h2>01 BPM TAP</h2>
<span id="bpm">120</span>
<button onclick="tapBpm()">TAP</button>
<button onclick="resetBpm()">RESET</button>
</section>

<section class="panel">
<h2>02 NOTES</h2>
<div class="row notes" id="notes"></div>
<div class="status" id="status">音を選択してください</div>
</section>

<section class="panel">
<h2>03 SCALE</h2>
<div class="row" id="scales"></div>
</section>

<section class="panel">
<h2>04 CHORDS</h2>
<div class="row" id="chords"></div>
</section>

<section class="panel">
<h2>05 REAL VOICING</h2>

<div class="row">
<button id="guitarBtn" class="active" onclick="setInstrument('guitar')">
🎸 GUITAR
</button>
<button id="pianoBtn" onclick="setInstrument('piano')">
🎹 PIANO
</button>
</div>

<div class="diagram" id="diagram">
<div class="empty">コードを選択してください</div>
</div>

<div class="row position" id="positions"></div>
</section>

<div class="credit">
Chord data: tombatossals/chords-db<br>
MIT License. Guitar data uses actual frets, fingers and barres from the database.
</div>

</div>

<script>
const NOTES=[
"C","C#","D","Eb","E","F","F#","G","Ab","A","Bb","B"
];

const DB_ROOT=
"https://raw.githubusercontent.com/tombatossals/chords-db/master/lib/";

let guitarDB=null;
let pianoDB=null;
let instrument="guitar";
let selectedNotes=[];
let selectedScale=null;
let selectedChord=null;
let positions=[];
let bpmTimes=[];

/* ---------- notes ---------- */

const notesBox=document.getElementById("notes");

NOTES.forEach(note=>{
 const b=document.createElement("button");
 b.textContent=note;
 b.onclick=()=>{
  if(selectedNotes.includes(note)){
   selectedNotes=selectedNotes.filter(x=>x!==note);
   b.classList.remove("selected");
  }else{
   selectedNotes.push(note);
   b.classList.add("selected");
  }
  findScales();
 };
 notesBox.appendChild(b);
});

/* ---------- scales ---------- */

const SCALES={
 "Major":[0,2,4,5,7,9,11],
 "Natural Minor":[0,2,3,5,7,8,10],
 "Dorian":[0,2,3,5,7,9,10],
 "Phrygian":[0,1,3,5,7,8,10],
 "Lydian":[0,2,4,6,7,9,11],
 "Mixolydian":[0,2,4,5,7,9,10],
 "Locrian":[0,1,3,5,6,8,10],
 "Major Pentatonic":[0,2,4,7,9],
 "Minor Pentatonic":[0,3,5,7,10],
 "Blues":[0,3,5,6,7,10]
};

function noteIndex(n){
 return NOTES.indexOf(n);
}

function findScales(){
 const box=document.getElementById("scales");
 box.innerHTML="";

 if(selectedNotes.length===0){
  document.getElementById("status").textContent=
   "音を選択するとスケール候補が表示されます";
  return;
 }

 let found=[];

 for(const [scaleName,intervals] of Object.entries(SCALES)){
  for(const root of NOTES){

   const rootIndex=noteIndex(root);

   const scaleNotes=intervals.map(i=>
    NOTES[(rootIndex+i)%12]
   );

   if(selectedNotes.every(n=>scaleNotes.includes(n))){
    found.push({
     root,
     name:scaleName,
     notes:scaleNotes
    });
   }
  }
 }

 found.forEach(scale=>{
  const b=document.createElement("button");
  b.textContent=scale.root+" "+scale.name;

  b.onclick=()=>{
   document.querySelectorAll("#scales button")
    .forEach(x=>x.classList.remove("selected"));

   b.classList.add("selected");
   selectedScale=scale;
   makeChords();
  };

  box.appendChild(b);
 });

 document.getElementById("status").textContent=
  selectedNotes.join(" / ")+" を含むスケール";
}

/* ---------- chord theory ---------- */

function chordQuality(root,third,fifth){

 const a=(third-root+12)%12;
 const b=(fifth-root+12)%12;

 if(a===4 && b===7)return "major";
 if(a===3 && b===7)return "minor";
 if(a===3 && b===6)return "dim";
 if(a===4 && b===8)return "aug";

 return "major";
}

function makeChords(){

 const box=document.getElementById("chords");
 box.innerHTML="";

 if(!selectedScale)return;

 const arr=selectedScale.notes;

 arr.forEach((root,i)=>{

  const third=arr[(i+2)%arr.length];
  const fifth=arr[(i+4)%arr.length];

  const r=noteIndex(root);
  const t=noteIndex(third);
  const f=noteIndex(fifth);

  const quality=chordQuality(r,t,f);

  let suffix="";
  let roman="";

  if(quality==="minor"){
   suffix="m";
   roman=["i","ii","iii","iv","v","vi","vii"][i];
  }else if(quality==="dim"){
   suffix="dim";
   roman=["i°","ii°","iii°","iv°","v°","vi°","vii°"][i];
  }else if(quality==="aug"){
   suffix="aug";
   roman=["I+","II+","III+","IV+","V+","VI+","VII+"][i];
  }else{
   suffix="";
   roman=["I","II","III","IV","V","VI","VII"][i];
  }

  const chordName=root+suffix;

  const b=document.createElement("button");
  b.className="chord";
  b.textContent=roman+"  "+chordName;

  b.onclick=()=>{
   document.querySelectorAll(".chord")
    .forEach(x=>x.classList.remove("selected"));

   b.classList.add("selected");

   selectedChord={
    root:root,
    suffix:quality,
    name:chordName
   };

   showChord();
  };

  box.appendChild(b);
 });
}

/* ---------- DB ---------- */

async function loadDatabases(){

 try{

  const [g,p]=await Promise.all([
   fetch(DB_ROOT+"guitar.json").then(r=>r.json()),
   fetch(DB_ROOT+"piano.json").then(r=>r.json())
  ]);

  guitarDB=g;
  pianoDB=p;

  document.getElementById("status").textContent=
   "コードDB読み込み完了";

 }catch(e){

  console.error(e);

  document.getElementById("status").textContent=
   "コードDBを読み込めませんでした。ネット接続を確認してください";
 }
}

/* DB key spelling */

function dbKey(root){

 const map={
  "C#":"C#",
  "Eb":"Eb",
  "F#":"F#",
  "Ab":"Ab",
  "Bb":"Bb"
 };

 return map[root]||root;
}

/* suffix names used by chords-db */

function suffixCandidates(q){

 if(q==="major")
  return ["major"];

 if(q==="minor")
  return ["minor","m"];

 if(q==="dim")
  return ["dim"];

 if(q==="aug")
  return ["aug"];

 return [q];
}

/* find actual DB chord */

function findDBChord(db,root,quality){

 if(!db)return null;

 const key=dbKey(root);

 let list=null;

 if(db.chords && db.chords[key])
  list=db.chords[key];

 else if(Array.isArray(db))
  list=db.filter(x=>x.key===key);

 if(!list)return null;

 for(const suffix of suffixCandidates(quality)){

  const result=list.find(x=>x.suffix===suffix);

  if(result)return result;
 }

 return null;
}

/* ---------- display ---------- */

function showChord(){

 const db=
  instrument==="guitar" ? guitarDB : pianoDB;

 const chord=findDBChord(
  db,
  selectedChord.root,
  selectedChord.suffix
 );

 const box=document.getElementById("diagram");

 if(!chord){

  positions=[];

  box.innerHTML=
   '<div class="empty">このコードのDBデータがありません</div>';

  document.getElementById("positions").innerHTML="";
  return;
 }

 positions=chord.positions||[];

 makePositionButtons();

 if(positions.length)
  drawPosition(0);
}

/* ---------- guitar ---------- */

function makePositionButtons(){

 const box=document.getElementById("positions");
 box.innerHTML="";

 positions.forEach((p,i)=>{

  const b=document.createElement("button");

  b.textContent="POSITION "+(i+1);

  b.onclick=()=>drawPosition(i);

  box.appendChild(b);
 });
}

function drawPosition(index){

 const p=positions[index];

 if(instrument==="guitar"){
  drawGuitar(p);
 }else{
  drawPiano(p);
 }
}

function drawGuitar(p){

 const frets=p.frets||[];
 const fingers=p.fingers||[];
 const base=p.baseFret||1;

 let html=
 '<div class="guitar">'+
 '<div class="guitar-title">'+selectedChord.name+'</div>'+
 '<div class="board">';

 /* strings */

 for(let s=0;s<6;s++){

  html+=
   '<div class="string" style="left:'+
   (s*20)+'%"></div>';
 }

 /* frets */

 for(let f=0;f<=5;f++){

  html+=
   '<div class="fret" style="top:'+
   (f*25)+'%"></div>';
 }

 html+='<div class="nut"></div>';

 /* strings / notes */

 frets.forEach((f,s)=>{

  const left=s*20;

  if(f==="x" || f==="X"){

   html+=
    '<div class="muted" style="left:'+
    left+'%">×</div>';

  }else if(String(f)==="0"){

   html+=
    '<div class="open" style="left:'+
    left+'%">○</div>';

  }else{

   const n=parseInt(f);

   const top=(n-.5)*25;

   const finger=fingers[s]||"";

   html+=
    '<div class="finger" style="left:'+
    left+'%;top:'+top+'%">'+
    finger+
    '</div>';
  }
 });

 /* fret number */

 html+=
  '<div class="fretnum" style="top:48px">'+
  base+
  '</div>';

 html+='</div></div>';

 document.getElementById("diagram").innerHTML=html;
}

/* ---------- piano ---------- */

function drawPiano(p){

 const notes=p.frets||[];

 const active=new Set(
  notes.map(normalizeNote)
 );

 const whites=[
  "C","D","E","F","G","A","B"
 ];

 let html=
 '<div class="piano">'+
 '<div class="piano-title">'+
 selectedChord.name+
 '</div>'+
 '<div class="keys">';

 /* 14 white keys */

 for(let i=0;i<14;i++){

  const n=whites[i%7];

  html+=
   '<div class="white">';

  if(active.has(n)){
   html+='<div class="key-dot">'+n+'</div>';
  }

  html+='</div>';
 }

 /* black keys */

 const blackNotes=["C#","D#","F#","G#","A#"];

 for(let i=0;i<13;i++){

  const note=blackNotes[i%5];

  const left=(i+1)*100/14-4;

  html+=
   '<div class="black" style="left:'+
   left+'%">';

  if(active.has(note)){
   html+='<div class="key-dot">'+note+'</div>';
  }

  html+='</div>';
 }

 html+='</div></div>';

 document.getElementById("diagram").innerHTML=html;
}

function normalizeNote(n){

 const map={
  "Db":"C#",
  "Eb":"D#",
  "Gb":"F#",
  "Ab":"G#",
  "Bb":"A#"
 };

 return map[n]||n;
}

/* ---------- instrument ---------- */

function setInstrument(type){

 instrument=type;

 document.getElementById("guitarBtn")
  .classList.toggle("active",type==="guitar");

 document.getElementById("pianoBtn")
  .classList.toggle("active",type==="piano");

 if(selectedChord)showChord();
}

/* ---------- BPM ---------- */

function tapBpm(){

 const now=Date.now();

 bpmTimes=bpmTimes.filter(t=>now-t<3000);
 bpmTimes.push(now);

 if(bpmTimes.length>=2){

  let total=0;

  for(let i=1;i<bpmTimes.length;i++)
   total+=bpmTimes[i]-bpmTimes[i-1];

  const avg=total/(bpmTimes.length-1);

  document.getElementById("bpm").textContent=
   Math.round(60000/avg);
 }
}

function resetBpm(){

 bpmTimes=[];

 document.getElementById("bpm").textContent="120";
}

/* start */

loadDatabases();

</script>
</body>
</html>
